name: "Unit tests"

on: [push, pull_request]

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: "ubuntu-latest"
            perl: "5.34.1" # whilst we're stuck on 22.04 (unavailable in GHA) where this is the Perl
            id_gen: "5.0.1"
          - os: "ubuntu-26.04"
            perl: "osnative" # anticipated (2026-11) next move
            id_gen: "5.0.1"
            # use experimental: true to allow for a failing NPG test or build
          - os: "ubuntu-latest"
            perl: "5.34.1"
            id_gen: "devel"
            experimental: true

    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.experimental == true }} # Experimental builds may fail

    defaults:
      run:
        shell: bash -l -e -o pipefail {0}

    env:
      PERL_CACHE: ~/perl5 # Perlbrew and CPAN modules installed here, cached
      NPG_LIB: ~/perl5npg # NPG modules installed here, not cached
      WSI_NPG_GITHUB_URL: https://github.com/wtsi-npg
      WSI_NPG_BUILD_BRANCH: ${{ github.base_ref || github.ref }}

    steps:
      - uses: actions/checkout@v7

      - name: "Install OS dependencies"
        run: |
          sudo apt-get update
          # https://github.com/actions/runner-images/issues/2139
          sudo apt-get remove -y nginx libgd3
          # libdevel-patchperl-perl is needed for perlbrew
          sudo apt-get install -y libgd-dev uuid-dev libgd-text-perl libdevel-patchperl-perl

      - name: "Get all git tags"
        run: |
          git fetch --prune --unshallow --tags --force
          git describe --always

      - uses: actions/setup-python@v7
        with:
          python-version: '3.10'
          architecture: 'x64'

      - name: "Cache Perl"
        id: cache-perl
        uses: actions/cache@v6
        with:
          path: ${{ env.PERL_CACHE }}
          key: ${{ runner.os }}-${{ matrix.os }}-${{ matrix.perl }}-perl

      - name: "Install Perlbrew"
        if: matrix.perl != 'osnative' && steps.cache-perl.outputs.cache-hit != 'true'
        run: |
          curl -sSL https://install.perlbrew.pl -o perlbrew.sh
          sha256sum -c .github/workflows/perlbrew.sha256
          export PERLBREW_ROOT=${{ env.PERL_CACHE }}
          sh perlbrew.sh

          source ${{ env.PERL_CACHE }}/etc/bashrc
          perlbrew available
          if [[ "${{ matrix.perl }}" == "5.34.1" ]]; then # default gcc for 26.04 too strict for 5.34.1
            perlbrew install --notest \
              -Dnoextensions=SDBM_File \
              perl-${{ matrix.perl }}
          else
            perlbrew install --notest perl-${{ matrix.perl }}
          fi
          perlbrew use perl-${{ matrix.perl }}
          perlbrew install-cpanm

      - name: "Archive Perlbrew logs on install failure"
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: perlbrew_log
          path: ~/perl5/build.perl-*.log
          retention-days: 5

      - name: "Initialize Perlbrew"
        if: matrix.perl != 'osnative'
        run: |
          echo "source ${{ env.PERL_CACHE }}/etc/bashrc" >> "$HOME/.bash_profile"

      - name: "OS native Perl cpanminus"
        if: matrix.perl == 'osnative'
        run: |
          sudo apt-get install -y cpanminus

      - name: "Install Perl dependencies"
        run: |
          cpanm --local-lib=${{ env.PERL_CACHE }} local::lib
          eval $(perl -I ${{ env.PERL_CACHE }}/lib/perl5/ -Mlocal::lib="$NPG_LIB")
          eval $(perl -I ${{ env.PERL_CACHE }}/lib/perl5/ -Mlocal::lib)

          cpanm --quiet --notest Module::Build
          cpanm --quiet --notest Net::SSLeay
          cpanm --quiet --notest LWP::Protocol::https
          cpanm --quiet --notest https://github.com/chapmanb/vcftools-cpan/archive/v0.953.tar.gz

          ./scripts/install_wsi_dependencies.sh "$NPG_LIB" \
             perl-dnap-utilities \
             perl-irods-wrap \
             ml_warehouse \
             npg_tracking \
             npg_seq_common \
             npg_qc

          cpanm --installdeps --notest .

      - name: "Log install failure"
        if: ${{ failure() }}
        run: |
          find ~/.cpanm/work -cmin -1 -name '*.log' -exec tail -n20  {} \;

      - name: "Archive CPAN logs on failure"
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: cpan_log
          path: ~/.cpanm/work/*/build.log
          retention-days: 5

      - name: "Install python dependencies"
        run: |
          python3 -m pip install git+https://github.com/wtsi-npg/npg_id_generation@${{ matrix.id_gen }}

      - name: "Run tests"
        id: run-tests
        continue-on-error: ${{ matrix.experimental == true }}
        run: |
          eval $(perl -I ${{ env.PERL_CACHE }}/lib/perl5/ -Mlocal::lib)
          eval $(perl -I ${{ env.PERL_CACHE }}/lib/perl5/ -Mlocal::lib="$NPG_LIB")

          export TEST_AUTHOR=1
          export PAC_BIO_ID_SCRIPT="$(which generate_pac_bio_id)"
          perl Build.PL
          ./Build test --verbose
          ./Build install

      - name: "Report experimental tests failure"
        if: steps.run-tests.outcome == 'failure' && matrix.experimental == true
        run: |
          echo "### ⚠️ Experimental Job Failed" >> $GITHUB_STEP_SUMMARY
          echo "An experimental test suite failed, but should not block this PR." >> $GITHUB_STEP_SUMMARY
          echo "::warning title=Experimental Element Matrix Failure::An experimental test suite failed but should not block this merge."
